name: Backend Linux Homologation

on:
  push:
    branches:
      - feat/sprint-03-homologacao-completa
    paths:
      - ".github/workflows/backend-linux-homologation.yml"
      - "backend/**"
      - "tests/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/deployment-readiness.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backend-linux-homologation.yml"
      - "backend/**"
      - "tests/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/deployment-readiness.md"

permissions:
  contents: read

concurrency:
  group: backend-linux-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      CLOUD_SQL_IAM_AUTH: "false"
      DATABASE_URL: sqlite://
      FIREBASE_ADMIN_USER_MANAGEMENT_ENABLED: "false"
      VERTEX_AI_ENABLED: "false"
      VERTEX_AI_APPROVED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run complete test suite
        run: uv run pytest -q -rs

      - name: Verify Alembic revision graph
        run: |
          uv run alembic heads
          uv run alembic history
