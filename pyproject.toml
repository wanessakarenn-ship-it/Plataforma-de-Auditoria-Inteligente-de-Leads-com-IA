[project]
name = "bc-lead-intelligence"
version = "0.1.0"
description = "Local-first lead auditing and import platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.16.2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
